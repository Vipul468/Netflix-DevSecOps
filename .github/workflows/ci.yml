name: Netflix DevSecOps CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Netflix API
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn requests python-dotenv

      - name: Check Python Syntax
        run: |
          python -m py_compile main.py

      - name: Test API Import
        run: |
          python -c "from main import app; print('Netflix API loaded successfully')"

      - name: CI Success
        run: |
          echo "Netflix DevSecOps CI completed successfully"